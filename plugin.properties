# JMeter Plugin Metadata
# Swagger / Postman Importer - v1.1

# Plugin identification
plugin.name=Swagger / Postman Importer for JMeter
plugin.id=swagger-postman-importer
plugin.version=1.1

# Plugin description and purpose
plugin.description=Imports Swagger/OpenAPI specifications and Postman collections to generate JMeter test plans
plugin.category=API Testing, Import/Export

# Plugin implementation class
plugin.main-class=com.example.jmeter.importer.SwaggerPostmanImporterAction
plugin.menu-creator-class=com.example.jmeter.importer.SwaggerPostmanImporterMenuCreator

# Compatibility information
plugin.jmeter-version-min=5.1.1
plugin.java-version-min=1.8

# Resource and deployment
plugin.type=jar
plugin.requires-installation=true

# Author and source
plugin.author=bakthava
plugin.homepage=https://github.com/bakthava/swagger-postman-importer
plugin.source-url=https://github.com/bakthava/swagger-postman-importer

# Features supported
plugin.features=swagger-import,postman-import,openapi-support,http-sampler-generation,parameter-extraction
